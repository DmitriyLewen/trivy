name: Automatic Backporting
run-name: "Backport #${{ inputs.pr-number }} to ${{ inputs.branch }}"

# Only users with write access to the repository can run a workflow_dispatch workflow,
# so no separate permission check is needed.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Number of the merged PR to backport
        required: true
        type: number
      branch:
        description: Target release branch (e.g. release/v0.50)
        required: true
        type: string

jobs:
  backport:
    name: Backport PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          if [[ "$BRANCH_NAME" == *".."* || ! "$BRANCH_NAME" =~ ^release/[A-Za-z0-9._-]+$ ]]; then
            echo "Error: invalid release branch name: $BRANCH_NAME" >&2
            exit 1
          fi
          MERGED=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')
          if [[ "$MERGED" != "true" ]]; then
            echo "Error: PR #$PR_NUMBER is not merged" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # backport.sh runs git push
          token: ${{ github.token }}

      - name: Set up Git user
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run backport script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: ./misc/backport/backport.sh "$BRANCH_NAME" "$PR_NUMBER"
